name: render

# Renders a film directory to MP4 on a GitHub-hosted Linux runner (no GPU needed: 2D, CPU raster).
# Manual: Actions → render → Run workflow (works from the GitHub mobile app).
# Also runs on pull requests that touch beatfilm, as a smoke test on the example film.
# To render private films, copy this file into a private repo and add a second checkout of
# thomasmillercarr/motion-studio for the scripts.
on:
  workflow_dispatch:
    inputs:
      film:
        description: Film directory (index.html, beats.json, audio/cut.m4a, approved direction.md)
        default: skills/beatfilm/examples/kairo
      res:
        description: 4k, 1080 or 720
        default: '1080'
  pull_request:
    paths: ['skills/beatfilm/**', '.github/workflows/render.yml']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILM: ${{ inputs.film || 'skills/beatfilm/examples/kairo' }}
      RES: ${{ inputs.res || '720' }}
      CHROME_PATH: /usr/bin/google-chrome
      CHROME_FLAGS: --no-sandbox --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unapproved films
        run: |
          case "$FILM" in */examples/*) exit 0;; esac
          head -1 "$FILM/direction.md" | grep -q '^status: approved' || { echo "::error::$FILM/direction.md is not approved"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node skills/beatfilm/scripts/render.mjs check "$FILM"
      - run: node skills/beatfilm/scripts/render.mjs render "$FILM" --res "$RES"
      - uses: actions/upload-artifact@v4
        with:
          name: film-${{ github.run_number }}
          path: |
            ${{ env.FILM }}/out/*.mp4
            ${{ env.FILM }}/CREDITS.txt
          if-no-files-found: error
